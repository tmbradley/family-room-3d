<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House planner</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <!-- Top bar: where you are, scanning, the inbox, who you are -->
  <header id="top">
    <button id="btnSide" class="tbtn icon-only" aria-label="Designs and rooms" title="Designs and rooms">☰</button>
    <div class="logo"><i></i><span>House planner</span></div>
    <nav class="crumb" id="crumb" aria-label="Where you are"></nav>
    <button id="btnScan" class="tbtn edit-only" title="Scan a room with the iPhone app">📱 <span class="lbl-t">Scan room</span></button>
    <div class="pop-wrap">
      <button id="btnInbox" class="tbtn" aria-haspopup="true" title="Pending proposals and scans">Inbox <span id="inboxN" class="badge" hidden>0</span></button>
      <div id="inboxPop" class="pop right" hidden></div>
    </div>
    <div class="pop-wrap">
      <button id="btnMe" class="avatar" aria-haspopup="true" title="Account">··</button>
      <div id="mePop" class="pop right" hidden></div>
    </div>
  </header>

  <!-- Sidebar: Current house (locked) and designs -->
  <aside id="side" aria-label="Rooms and designs"></aside>

  <!-- One toolbar for what is open -->
  <div id="tool" role="toolbar"></div>

  <!-- Canvas: one view, or two in Compare -->
  <main id="canvas">
    <div id="panes"></div>
    <div id="banner" class="banner" hidden></div>
    <div id="legend" class="legend" hidden><span><i style="background:#1e9e5a"></i>added</span><span><i style="background:#f0b400"></i>changed</span><span><i style="background:#a3341f"></i>removed</span></div>
    <div id="diffbar" class="diffbar" hidden></div>
    <div id="floatbar" class="floatbar edit-only" hidden>
      <button data-fb="rotate" title="Rotate 90° (R)">⟳ <span class="lbl-t">Rotate</span></button>
      <button data-fb="duplicate" title="Duplicate this piece">⧉ <span class="lbl-t">Duplicate</span></button>
      <button data-fb="delete" title="Delete (Del)">🗑 <span class="lbl-t">Delete</span></button>
    </div>
    <div id="vctl" class="vctl">
      <button id="btn3d" title="3D view">3D</button><button id="btnTop" title="Top view">Top</button>
      <button id="btnWalls" title="Walls: cutaway (3') or full">Walls: cutaway</button>
      <button id="btnLabels" title="Show labels">Labels ✓</button>
      <div class="pop-wrap"><button id="btnGear" title="View settings" aria-haspopup="true">⚙</button>
        <div id="gearPop" class="pop up right" hidden>
          <label class="check"><input type="checkbox" id="snapToggle" checked> Snap to 3"</label>
        </div>
      </div>
    </div>
  </main>

  <!-- Inspector: Details / Proposals / History -->
  <aside id="insp" aria-label="Inspector">
    <div class="itabs" role="tablist">
      <button data-tab="details" role="tab">Details</button>
      <button data-tab="proposals" role="tab">Proposals <span id="propN" class="badge" hidden>0</span></button>
      <button data-tab="history" role="tab">History</button>
      <span class="grow"></span>
      <button id="btnInspClose" class="icon-only phone-only" aria-label="Close">✕</button>
    </div>
    <div id="inspBody"></div>
  </aside>

  <div id="scrim" hidden></div>
  <div id="signin" class="overlay" hidden>
    <div class="card">
      <h2>Sign in</h2>
      <p>Sign in with your passkey to load your house.</p>
      <a class="button" href="/login">Sign in</a>
    </div>
  </div>
  <div id="toast" hidden></div>
  <button id="btnInspOpen" class="phone-only fab" aria-label="Details">ⓘ</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
