name: HousePlanner

options:
  bundleIdPrefix: com.michaelbradley
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HousePlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HousePlanner
    entitlements:
      path: HousePlanner/HousePlanner.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:app-production-1828.up.railway.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelbradley.houseplanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q3HHMS5MLX
        CODE_SIGN_ENTITLEMENTS: HousePlanner/HousePlanner.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "House Planner"
        INFOPLIST_KEY_NSCameraUsageDescription: "The camera and LiDAR scanner capture your room's walls, doors and windows, room photos, and 3D models of furniture."
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit

schemes:
  HousePlanner:
    build:
      targets:
        HousePlanner: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
