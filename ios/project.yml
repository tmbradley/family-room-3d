name: HousePlanner

options:
  bundleIdPrefix: com.michaelbradley
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HousePlanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HousePlanner
    dependencies:
      - target: HousePlannerClip
        embed: true
        embedType: appClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelbradley.houseplanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  HousePlannerClip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - HousePlannerClip
    info:
      path: HousePlannerClip/Info.plist
      properties:
        NSCameraUsageDescription: "We need camera access to scan your room with LiDAR"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelbradley.houseplanner.clip
        INFOPLIST_FILE: HousePlannerClip/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Scan Room"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      release:
        SWIFT_COMPILATION_MODE: wholemodule
    entitlements:
      path: HousePlannerClip/HousePlannerClip.entitlements
      properties:
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.michaelbradley.houseplanner
        com.apple.developer.associated-domains:
          - appclips:app-production-1828.up.railway.app

schemes:
  HousePlanner:
    build:
      targets:
        HousePlanner: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HousePlannerClip:
    build:
      targets:
        HousePlannerClip: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
