<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · House Planner</title>
  <style>
    :root { --bg:#f6f1e8; --ink:#2b2420; --muted:#7a6e64; --accent:#a8622f; --card:#fffdf9; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
           font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
    .card { width:100%; max-width:400px; background:var(--card); border-radius:14px; padding:28px 24px;
            box-shadow: 0 8px 30px rgba(60,40,20,.12); }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display:block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input { width:100%; font-size:17px; padding:12px; border:1px solid #d8cfc3; border-radius:10px; background:#fff;
            letter-spacing: .06em; text-transform: uppercase; }
    button { width:100%; margin-top:16px; font-size:17px; padding:13px; border:0; border-radius:10px;
             background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button.link { background:none; color:var(--accent); font-weight:500; padding:6px; font-size:14px; }
    .hidden { display:none; }
    .msg { margin-top:14px; font-size:14px; min-height: 1em; }
    .err { color:#a3322a; }
    .codes { font-family: ui-monospace, Menlo, monospace; columns: 2; background:#f3ece2; padding:12px; border-radius:10px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>House Planner</h1>
    <p class="sub" id="sub">Sign in with your passkey.</p>

    <section id="signin" class="hidden">
      <button id="btn-signin">Sign in with passkey</button>
      <button class="link" id="show-recover">Use a recovery code</button>
    </section>

    <section id="setup" class="hidden">
      <label for="setup-code">One-time setup code</label>
      <input id="setup-code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX" />
      <label for="device">Name this device (optional)</label>
      <input id="device" style="text-transform:none;letter-spacing:0" placeholder="iPhone, MacBook…" />
      <button id="btn-setup">Create passkey</button>
    </section>

    <section id="recover" class="hidden">
      <label for="recovery-code">Recovery code</label>
      <input id="recovery-code" placeholder="XXXX-XXXX-XXXX" />
      <button id="btn-recover">Sign in</button>
      <button class="link" id="hide-recover">Back</button>
    </section>

    <section id="signedin" class="hidden">
      <p>You're signed in.</p>
      <div id="codes-wrap" class="hidden">
        <p><strong>Save these recovery codes now.</strong> Each works once if you lose your passkey. They won't be shown again.</p>
        <div class="codes" id="codes"></div>
      </div>
      <button id="btn-add">Add a passkey for another device</button>
      <button id="btn-open">Open the editor</button>
      <button class="link" id="btn-logout">Sign out</button>
    </section>

    <div class="msg" id="msg"></div>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
